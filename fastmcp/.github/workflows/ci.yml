name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd fastmcp
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          cd fastmcp
          uv run ruff check .

      - name: Type-check with mypy
        run: |
          cd fastmcp
          uv run mypy --ignore-missing-imports --no-strict-optional . || true
        continue-on-error: true  # mypy is informational; voyager-shaped JSON is hard to type

      - name: Run tests
        run: |
          cd fastmcp
          uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: ./fastmcp
          push: false
          tags: linkedin-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
