[project]
name = "linkedin-mcp-fastmcp"
version = "1.0.0"
description = "FastMCP server exposing authenticated LinkedIn tools via Voyager API and the official data export. Deployable to FastMCP Cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tatiana Pustovetova", email = "" }
]
keywords = ["mcp", "linkedin", "fastmcp", "voyager-api", "model-context-protocol"]

dependencies = [
    "fastmcp>=2.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    # Local-only Chrome cookie fallback (env var auth is the primary path)
    "pycookiecheat>=0.7.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.urls]
Repository = "https://github.com/tatianathevisionary/linkedin-mcp"
"Bug Tracker" = "https://github.com/tatianathevisionary/linkedin-mcp/issues"

[project.scripts]
linkedin-mcp = "server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkedin", "."]
include = ["server.py", "auth.py", "voyager.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
